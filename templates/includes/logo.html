{% comment %}
  Rubi Cleaning Services logo: gem mark + wordmark.
  Usage: {% include "includes/logo.html" %}  or  {% include "includes/logo.html" with dark=True %}
{% endcomment %}
<span class="inline-flex items-center gap-2.5 leading-none whitespace-nowrap">
  <span class="relative flex items-center justify-center w-11 h-11 rounded-xl bg-gradient-to-br from-blue-600 via-blue-500 to-emerald-500 shadow-md shadow-blue-500/30 shrink-0">
    <svg viewBox="0 0 24 24" class="w-6 h-6 text-white" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true">
      <path d="M6.5 4h11l4 5.5L12 21 2.5 9.5z" fill="currentColor" fill-opacity=".18"/>
      <path d="M2.5 9.5h19M9.5 4 8 9.5 12 21l4-11.5L14.5 4"/>
    </svg>
    <svg viewBox="0 0 24 24" class="absolute -top-1 -right-1 w-4 h-4 text-amber-300 drop-shadow" fill="currentColor" aria-hidden="true">
      <path d="M12 2l2.2 7.8L22 12l-7.8 2.2L12 22l-2.2-7.8L2 12l7.8-2.2z"/>
    </svg>
  </span>
  <span class="flex flex-col">
    <span class="text-[22px] font-extrabold tracking-tight {% if dark %}text-white{% else %}text-gray-900{% endif %}">
      <span class="{% if dark %}text-blue-400{% else %}text-blue-700{% endif %}">Rubi</span>Cleaning
    </span>
    <span class="mt-1 flex items-center gap-1.5 text-[10px] font-bold uppercase tracking-[0.42em] {% if dark %}text-emerald-400{% else %}text-emerald-600{% endif %}">
      <span class="h-px w-3 bg-current opacity-60"></span>Services<span class="h-px w-3 bg-current opacity-60"></span>
    </span>
  </span>
</span>
